<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="theme-color" content="#37281E" />
        <title>Offline · Lehi YSA 4th Ward</title>
        <style>
            :root {
                color-scheme: light dark;
            }
            * {
                box-sizing: border-box;
            }
            body {
                margin: 0;
                min-height: 100dvh;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                gap: 1.25rem;
                padding: 2rem;
                text-align: center;
                font-family:
                    ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
                background: #37281e;
                color: #efe9e1;
            }
            .mark {
                width: 96px;
                height: 96px;
                border-radius: 20px;
            }
            h1 {
                margin: 0;
                font-size: 1.4rem;
                font-weight: 700;
            }
            p {
                margin: 0;
                max-width: 32ch;
                line-height: 1.5;
                opacity: 0.8;
            }
            button {
                margin-top: 0.5rem;
                padding: 0.65rem 1.4rem;
                font: inherit;
                font-weight: 600;
                color: #37281e;
                background: #efe9e1;
                border: 0;
                border-radius: 0.5rem;
                cursor: pointer;
            }
            button:active {
                transform: translateY(1px);
            }
        </style>
    </head>
    <body>
        <img class="mark" src="/icons/icon-192.png" alt="" width="96" height="96" />
        <h1>You're offline</h1>
        <p>This page isn't available without a connection. Reconnect and try again.</p>
        <button type="button" onclick="location.reload()">Retry</button>
    </body>
</html>
